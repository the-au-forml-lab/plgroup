name: "Test changes"

on:
  push:
    branches: [ main ]
    paths: [ src/**.ts ]
  pull_request:
    branches: [ main ]
    paths: [ src/**.ts ]


jobs:
  test:
    name: Command tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx tsc
      - run: npm run choose
      - run: npm run details 10.1145/3158093
      - run: npm run stats
